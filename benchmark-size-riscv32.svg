<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Code size on riscv32">

  <style>
    .bg   { fill: #ffffff; }
    .ax   { stroke: #c8c8c8; stroke-width: 1; }
    .grid { stroke: #ececec; stroke-width: 1; }
    text  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
            Helvetica, Arial, sans-serif; fill: #24292f; }
    .title  { font-size: 15px; font-weight: 600; }
    .sub    { font-size: 11px; fill: #57606a; }
    .lbl    { font-size: 11.5px; }
    .val    { font-size: 11px; font-weight: 600; }
    .ref    { stroke: #d1242f; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .reftxt { font-size: 10px; fill: #d1242f; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .ax   { stroke: #30363d; }
      .grid { stroke: #21262d; }
      text  { fill: #e6edf3; }
      .sub  { fill: #8b949e; }
      .ref    { stroke: #ff7b72; }
      .reftxt { fill: #ff7b72; }
    }
  </style>

<rect class="bg" width="760" height="300"/>
<text class="title" x="16" y="24">Code size on riscv32</text>
<text class="sub" x="16" y="40">.text of the decoder built -Os · lower is better</text>
<line class="grid" x1="327.5" y1="46" x2="327.5" y2="266.0"/>
<line class="grid" x1="445.0" y1="46" x2="445.0" y2="266.0"/>
<line class="grid" x1="562.5" y1="46" x2="562.5" y2="266.0"/>
<line class="grid" x1="680.0" y1="46" x2="680.0" y2="266.0"/>
<line class="ax" x1="210" y1="46" x2="210" y2="266.0"/>
<text class="lbl" x="202" y="160.0" text-anchor="end">decoder .text</text>
<rect x="210" y="139.0" width="398.3" height="14.5" fill="#1f4e79" rx="1.5"><title>minimp3-fixed: 50,808 bytes</title></rect>
<text class="val" x="613.3" y="149.0">50,808</text>
<rect x="210" y="156.0" width="341.3" height="14.5" fill="#7fb3d5" rx="1.5"><title>minimp3-float: 43,542 bytes</title></rect>
<text class="val" x="556.3" y="166.0">43,542</text>
<rect x="16" y="281" width="10" height="10" fill="#1f4e79" rx="1.5"/>
<text class="sub" x="31" y="290">fixed point</text>
<rect x="115" y="281" width="10" height="10" fill="#7fb3d5" rx="1.5"/>
<text class="sub" x="130" y="290">floating point</text>
<text class="sub" x="744" y="290" text-anchor="end">bytes</text>
</svg>
